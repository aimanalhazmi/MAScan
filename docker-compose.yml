services:
  # MAScan FastAPI
  mascan-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mascan-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      HOME: /app
      # the self-hosted Firecrawl
      FIRECRAWL_API_URL: http://firecrawl:3002
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      # Reddit session cached on the host by `rdt login`. Mounted read-only so the
      # reddit_search tool can authenticate non-interactively inside the container.
      - ${HOME}/.config/rdt-cli:/app/.config/rdt-cli:ro
    command:
      [
        "uvicorn",
        "mascan.app.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/src",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      firecrawl:
        condition: service_started

  # Self-hosted Firecrawl
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: mascan-firecrawl
    restart: unless-stopped
    ports:
      - "3002:3002"
    command: node dist/src/harness.js --start-docker
    environment:
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      USE_DB_AUTHENTICATION: "false"
      HOST: "0.0.0.0"
      PORT: "3002"
      ENV: local
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_started

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: mascan-firecrawl-playwright
    restart: unless-stopped
    environment:
      PORT: "3000"

  firecrawl-redis:
    image: redis:alpine
    container_name: mascan-firecrawl-redis
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    container_name: mascan-firecrawl-rabbitmq
    restart: unless-stopped
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: mascan-firecrawl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

  # Open WebUI
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mascan-openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - openwebui-data:/app/backend/data
    depends_on:
      mascan-api:
        condition: service_healthy
    environment:
      # Disable Ollama since we don't use it; speeds up startup.
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "true"
      # We chat with the MAScan API only; no local RAG/document search.
      # Setting a non-local embedding engine stops Open WebUI from
      # downloading the SentenceTransformers model from HuggingFace on
      # startup (the source of the "unauthenticated requests / set a
      # HF_TOKEN" warning). The engine is never actually called since
      # RAG is unused.
      RAG_EMBEDDING_ENGINE: "openai"

volumes:
  openwebui-data:
    name: mascan-openwebui-data