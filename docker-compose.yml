services:
  # MAScan FastAPI
  mascan-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mascan-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      HOME: /app
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      # Reddit session cached on the host by `rdt login`. Mounted read-only so the
      # reddit_search tool can authenticate non-interactively inside the container.
      - ${HOME}/.config/rdt-cli:/app/.config/rdt-cli:ro
    command:
      [
        "uvicorn",
        "mascan.app.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/src",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Open WebUI
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mascan-openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - openwebui-data:/app/backend/data
    depends_on:
      mascan-api:
        condition: service_healthy
    environment:
      # Disable Ollama since we don't use it; speeds up startup.
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "true"

volumes:
  openwebui-data:
    name: mascan-openwebui-data